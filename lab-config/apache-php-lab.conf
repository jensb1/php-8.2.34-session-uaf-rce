# CVE-2026-109618/109619 lab: single-worker prefork, PHP 8.2.34 module
Listen 8084
PHPIniDir /etc/php-lab

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

<VirtualHost *:8084>
    DocumentRoot /var/www/lab
    <Directory /var/www/lab>
        Require all granted
        AllowOverride None
    </Directory>
    ErrorLog /var/log/apache2/php-lab-error.log
    CustomLog /var/log/apache2/php-lab-access.log combined
    LogLevel info
</VirtualHost>
